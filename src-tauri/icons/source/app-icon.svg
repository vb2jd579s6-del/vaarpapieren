<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source for `npm run tauri icon`; the shield and ship are redrawn from src/assets/tharsis-logo.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b41"/>
      <stop offset="1" stop-color="#062a2f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9496"/>
      <stop offset="0.5" stop-color="#1f5d61"/>
      <stop offset="1" stop-color="#3f8a8c"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824×824 body with 100 px margin, corner radius ≈ 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(6.6) translate(-38 -45)">
    <path d="M9 0 H67 L76 12 V64 L38 90 L0 64 V12 Z" fill="url(#shield)" stroke-linejoin="round"/>
    <g fill="#ffffff">
      <rect x="37.1" y="11.5" width="1.8" height="44" rx="0.9"/>
      <path d="M30 13.5 C50 14 64 22 63 33 C62 44 48 52 27 53.5 C42 46 47 40 46 33 C45 25 41 18 30 13.5 Z"/>
      <path d="M14 54.5 Q38 62 61 52.5 C58 64 46 68.5 38 68.5 C28 68.5 19 63 14 54.5 Z"/>
    </g>
    <line x1="24" y1="54.5" x2="13" y2="64.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
